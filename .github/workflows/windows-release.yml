# Builds the Windows installer on a real Windows machine.
#   - Pushing a tag like v0.1.0 builds it and publishes a GitHub release.
#   - Running it by hand (Actions tab -> "Windows release" -> Run workflow)
#     builds and keeps the installer as a downloadable artifact, no release.
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to create the release

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Work out the version
        id: version
        run: |
          $declared = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            if ($version -ne $declared) {
              throw "Tag v$version does not match pyproject.toml version $declared"
            }
          } else {
            $version = "$declared-dev"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Install dependencies
        # PySide6-Essentials has nearly every Qt module the app uses, at a
        # fraction of the size of the full PySide6. PySide6-WebEngine is here for
        # Qt WebEngine alone (the HoYoLAB sign-in window; since PySide6 6.12 it
        # is a wheel of its own, not part of PySide6-Addons, which it pulls in);
        # PyInstaller bundles only the Qt modules that are imported.
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials PySide6-WebEngine numpy Pillow pytesseract rapidfuzz mss tzdata pyinstaller pytest

      - name: Run the tests
        run: python -m pytest -q

      - name: Add the Google sign-in client
        # Lumenspar's own Google client, so Drive backup needs no setup. Without
        # the secret (forks, test builds) users connect a project of their own.
        env:
          GOOGLE_CLIENT: ${{ secrets.LUMENSPAR_GOOGLE_CLIENT }}
        run: |
          if ($env:GOOGLE_CLIENT) {
            Set-Content -Path lumenspar/google_client.json -Value $env:GOOGLE_CLIENT -Encoding utf8NoBOM
            Write-Host "Google sign-in client included"
          } else { Write-Host "No LUMENSPAR_GOOGLE_CLIENT secret: users set up their own project" }

      - name: Bundle the app (PyInstaller)
        run: pyinstaller packaging/windows/lumenspar.spec --noconfirm

      - name: Start the bundled app once (headless self-check)
        # Proves the bundle carries every QML module and data file the window
        # needs -- the usual way a frozen Qt app breaks.
        env:
          QT_QPA_PLATFORM: offscreen
          LUMENSPAR_SMOKE_TEST: ${{ runner.temp }}\smoke.txt
        run: |
          $p = Start-Process -FilePath "dist\Lumenspar\Lumenspar.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "The app did not exit within 2 minutes" }
          if (Test-Path $env:LUMENSPAR_SMOKE_TEST) { Get-Content $env:LUMENSPAR_SMOKE_TEST } else { throw "No self-check report was written (exit code $($p.ExitCode))" }
          if ($p.ExitCode -ne 0) { throw "Self-check failed (exit code $($p.ExitCode))" }

      - name: Build the installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\lumenspar.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\installer

      - uses: actions/upload-artifact@v4
        with:
          name: Lumenspar-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe

      - name: Publish the release
        # The Linux workflow builds from the same tag; whichever finishes
        # first creates the release and the other adds its file to it.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" `
              --title "Lumenspar ${{ steps.version.outputs.version }}" `
              --notes-file packaging/RELEASE_NOTES.md `
              --prerelease
          }
          gh release upload "${{ github.ref_name }}" (Get-ChildItem dist\installer\*.exe).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload failed" }

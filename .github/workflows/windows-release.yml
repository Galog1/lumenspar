# Builds the Windows installer on a real Windows machine.
#   - Pushing a tag like v0.1.0 builds it and publishes a GitHub release.
#   - Running it by hand (Actions tab -> "Windows release" -> Run workflow)
#     builds and keeps the installer as a downloadable artifact, no release.
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to create the release

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Work out the version
        id: version
        run: |
          $declared = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            if ($version -ne $declared) {
              throw "Tag v$version does not match pyproject.toml version $declared"
            }
          } else {
            $version = "$declared-dev"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Install dependencies
        # PySide6-Essentials has every Qt module the app uses, at a fraction
        # of the size of the full PySide6 (which adds WebEngine and friends).
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6-Essentials numpy Pillow pytesseract rapidfuzz mss tzdata pyinstaller pytest

      - name: Run the tests
        run: python -m pytest -q

      - name: Bundle the app (PyInstaller)
        run: pyinstaller packaging/windows/lumenspar.spec --noconfirm

      - name: Start the bundled app once (headless self-check)
        # Proves the bundle carries every QML module and data file the window
        # needs -- the usual way a frozen Qt app breaks.
        env:
          QT_QPA_PLATFORM: offscreen
          LUMENSPAR_SMOKE_TEST: ${{ runner.temp }}\smoke.txt
        run: |
          $p = Start-Process -FilePath "dist\Lumenspar\Lumenspar.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "The app did not exit within 2 minutes" }
          if (Test-Path $env:LUMENSPAR_SMOKE_TEST) { Get-Content $env:LUMENSPAR_SMOKE_TEST } else { throw "No self-check report was written (exit code $($p.ExitCode))" }
          if ($p.ExitCode -ne 0) { throw "Self-check failed (exit code $($p.ExitCode))" }

      - name: Build the installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\lumenspar.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\installer

      - uses: actions/upload-artifact@v4
        with:
          name: Lumenspar-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist\installer\*.exe).FullName `
            --title "Lumenspar ${{ steps.version.outputs.version }} for Windows" `
            --notes-file packaging/windows/RELEASE_NOTES.md `
            --prerelease
